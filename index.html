<style>
  :root {
    --ground: #FEF3F1; --card: #FFFFFF; --ink: #2A2024; --muted: #8A7A7E;
    --line: #F3E4E1; --accent: #E8456F; --accent-ink: #FFFFFF;
    --bar: #3A3034; --bar-ink: #FFF6F4; --shadow: 0 2px 10px rgba(120,70,80,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #241A1E; --card: #2E2327; --ink: #F6EAEC; --muted: #B09CA2;
      --line: #3B2D32; --accent: #FF6C90; --accent-ink: #2A1119;
      --bar: #161013; --bar-ink: #F3E2E5; --shadow: 0 2px 12px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    --ground: #241A1E; --card: #2E2327; --ink: #F6EAEC; --muted: #B09CA2;
    --line: #3B2D32; --accent: #FF6C90; --accent-ink: #2A1119;
    --bar: #161013; --bar-ink: #F3E2E5; --shadow: 0 2px 12px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  /* 글자 위에서 커서가 I빔으로 바뀌지 않게 — 앱처럼 보이게 한다 */
  body { cursor: default; -webkit-user-select: none; user-select: none; }
  a, button, .card, .buy { cursor: pointer; }
  input, .addr, footer { cursor: auto; -webkit-user-select: text; user-select: text; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    line-height: 1.55; -webkit-font-smoothing: antialiased;
  }

  /* 고지 띠 — 빈 구간 없이 이어 흐르게: 같은 문구 4벌을 깔고 정확히 절반만 이동시킨다 */
  .notice { background: var(--bar); color: var(--bar-ink); overflow: hidden; padding: 9px 0; }
  .track { display: flex; width: max-content; animation: marquee 20s linear infinite; }
  .track span { white-space: nowrap; font-size: 12px; padding-right: 44px; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .track { animation: none; width: 100%; justify-content: center; }
    .track span:not(:first-child) { display: none; }
    .track span { padding-right: 0; white-space: normal; text-align: center; font-size: 11.5px; padding: 0 14px; }
  }

  /* 세로 리듬 — 프로필은 붙이고, 섹션끼리는 넉넉히 */
  .wrap { max-width: 440px; margin: 0 auto; padding: 32px 16px 64px;
          display: flex; flex-direction: column; gap: 26px; }
  .wrap > section + section { margin-top: 6px; }
  .wrap > footer { margin-top: 10px; }

  .profile { display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; }
  .logo {
    width: 104px; height: 104px; border-radius: 50%;
    object-fit: cover; display: block; box-shadow: var(--shadow);
  }
  .biz {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
    font-family: inherit; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .biz:hover { border-color: var(--accent); transform: translateY(-1px); }

  .sheet {
    display: none; flex-direction: column; gap: 8px; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; box-shadow: var(--shadow);
  }
  .sheet[data-open="1"] { display: flex; }
  .sheet a, .sheet button {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; font-size: 14px;
    text-decoration: none; cursor: pointer; transition: background .12s ease, border-color .12s ease;
  }
  .sheet a:hover, .sheet button:hover { border-color: var(--accent); }
  .sheet .addr { color: var(--muted); font-size: 12.5px; text-align: center; padding-top: 2px; }

  .search { position: relative; }
  .search input {
    width: 100%; padding: 15px 16px 15px 44px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 14.5px; box-shadow: var(--shadow);
  }
  .search input::placeholder { color: var(--muted); }
  .search > svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .feature { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
  .feature > a { display: block; text-decoration: none; }
  .feature .shot { width: 100%; aspect-ratio: 1/1; background: var(--line) center/cover no-repeat;
                   display: grid; place-items: center; font-weight: 900; font-size: 44px; color: var(--accent); }
  .feature .body { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .feature h2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5;
                text-align: center; text-wrap: balance; word-break: keep-all; }
  .buy {
    display: flex; align-items: center; justify-content: center; line-height: 1;
    min-height: 48px; text-align: center; text-decoration: none; background: var(--accent);
    color: var(--accent-ink); font-weight: 700; padding: 0 14px; border-radius: 12px; font-size: 15px;
    transition: filter .12s ease, transform .12s ease;
  }
  .buy:hover { filter: brightness(1.06); }
  .buy:active { transform: translateY(1px); }

  h3.section { margin: 0 0 14px; font-size: 13.5px; font-weight: 700; color: var(--muted); text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
          color: inherit; display: flex; flex-direction: column; position: relative; }
  .card > a.buy-link { text-decoration: none; color: inherit; display: flex; flex-direction: column; }
  /* 버튼 두 개 — 구매(채움) + 영상(유튜브 빨강) */
  .actions { display: flex; gap: 7px; padding: 0 10px 11px; }
  .actions .go {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
    line-height: 1; min-height: 34px; text-decoration: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12.5px;
    padding: 0 4px; border-radius: 9px; white-space: nowrap; transition: filter .12s ease;
  }
  .actions .go:hover { filter: brightness(1.06); }
  .yt {
    flex: none; width: 40px; min-height: 34px; border-radius: 9px; background: #FF0033;
    display: grid; place-items: center; transition: filter .12s ease;
  }
  .yt:hover { filter: brightness(1.1); }
  .yt svg { display: block; }
  .watch {
    display: block; text-align: center; text-decoration: none; font-size: 13.5px; font-weight: 500;
    color: var(--muted); padding: 4px 0 0;
  }
  .watch:hover { color: var(--accent); }
  .card .shot { width: 100%; aspect-ratio: 1/1; background: var(--line) center/cover no-repeat;
                display: grid; place-items: center; font-weight: 900; font-size: 28px; color: var(--accent); }
  /* 제목 — 항상 2줄 높이로 고정해서 카드 크기를 통일한다.
     한 줄짜리는 그 안에서 세로 가운데, 넘치면 …으로 자른다 */
  .card .name-box { padding: 11px 10px 10px; height: calc(2 * 1.45em + 21px);
                    display: flex; align-items: center; justify-content: center; }
  .card .name { font-size: 13px; font-weight: 700; line-height: 1.45;
                text-align: center; text-wrap: balance; word-break: keep-all;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 20px 0; }

  a:focus-visible, input:focus-visible, button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; }
  footer { color: var(--muted); font-size: 11.5px; text-align: center; line-height: 1.7; }
</style>

  const MAIL = "mongddangreview@gmail.com";
  const SUBJECT = "[협업 제안] 몽땅리뷰";
  const BODY = "브랜드명:\n제품:\n진행 채널:\n일정:\n제안 내용:\n";

  const $ = id => document.getElementById(id);

  // 비즈니스 제안 — 메일 앱만 뜨면 불편하니 Gmail / 메일앱 / 주소복사 중 고르게 한다
  $("gmail").href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(MAIL) +
                    "&su=" + encodeURIComponent(SUBJECT) + "&body=" + encodeURIComponent(BODY);
  $("bizBtn").addEventListener("click", () => {
    const open = $("sheet").dataset.open === "1";
    $("sheet").dataset.open = open ? "0" : "1";
    $("bizBtn").setAttribute("aria-expanded", String(!open));
  });
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(MAIL); $("copy").firstChild.nodeValue = "복사됐어요 "; }
    catch { $("copy").firstChild.nodeValue = "복사 실패 — 아래 주소를 직접 " ; }
    setTimeout(() => { $("copy").firstChild.nodeValue = "주소 복사 "; }, 1800);
  });

  const YT_SVG = '<svg width="16" height="12" viewBox="0 0 24 17" fill="#fff" aria-hidden="true">' +
    '<path d="M23.5 2.7A3 3 0 0 0 21.4.6C19.6 0 12 0 12 0S4.4 0 2.6.6A3 3 0 0 0 .5 2.7 31 31 0 0 0 0 8.5c0 2 .2 4 .5 5.8a3 3 0 0 0 2.1 2.1C4.4 17 12 17 12 17s7.6 0 9.4-.6a3 3 0 0 0 2.1-2.1c.3-1.9.5-3.8.5-5.8s-.2-4-.5-5.8Z"/>' +
    '<path d="M9.6 12.1 15.9 8.5 9.6 4.9v7.2Z" fill="#141014"/></svg>';

  function ytBadge(p) {
    if (!p.video) return null;
    const a = document.createElement("a");
    a.className = "yt"; a.href = p.video; a.target = "_blank"; a.rel = "noopener";
    a.setAttribute("aria-label", p.short + " 영상 보기");
    a.innerHTML = YT_SVG;
    return a;
  }

  function shot(p) {
    const el = document.createElement("div");
    el.className = "shot";
    if (p.image) el.style.backgroundImage = 'url("' + p.image + '")';
    else el.textContent = p.short.trim().charAt(0);
    return el;
  }

  function renderFeature(p, searching) {
    $("featureWrap").hidden = searching;
    if (searching) return;
    const f = $("feature");
    f.replaceChildren();
    // 이미지도 눌리게 — 사진을 누르는 사람이 버튼만큼 많다
    const shotLink = document.createElement("a");
    shotLink.href = p.link; shotLink.target = "_blank"; shotLink.rel = "noopener";
    shotLink.setAttribute("aria-label", p.short + " 구매 페이지 열기");
    shotLink.append(shot(p));
    const body = document.createElement("div");
    body.className = "body";
    const h2 = document.createElement("h2"); h2.textContent = p.name;
    const buy = document.createElement("a");
    buy.className = "buy"; buy.href = p.link; buy.target = "_blank"; buy.rel = "noopener";
    buy.textContent = "구매하러 가기";
    body.append(h2, buy);
    f.append(shotLink, body);
  }

  function renderGrid(items) {
    const g = $("grid");
    g.replaceChildren();
    items.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      const imgLink = document.createElement("a");
      imgLink.className = "buy-link"; imgLink.href = p.link;
      imgLink.target = "_blank"; imgLink.rel = "noopener";
      imgLink.setAttribute("aria-label", p.short + " 구매 페이지 열기");
      imgLink.append(shot(p));

      const nmBox = document.createElement("div");
      nmBox.className = "name-box";
      const nm = document.createElement("div");
      nm.className = "name"; nm.textContent = p.short;
      nm.title = p.name;
      nmBox.append(nm);

      const actions = document.createElement("div");
      actions.className = "actions";
      const go = document.createElement("a");
      go.className = "go"; go.href = p.link; go.target = "_blank"; go.rel = "noopener";
      go.textContent = "구매하러 가기";
      actions.append(go);
      const yt = ytBadge(p);
      if (yt) actions.append(yt);

      card.append(imgLink, nmBox, actions);
      g.append(card);
    });
    $("empty").hidden = items.length > 0;
  }

  function render() {
    const q = $("q").value.trim();
    const slug = location.hash.replace("#", "");
    const featured = PRODUCTS.find(p => p.slug === slug) || PRODUCTS[0];
    if (q) {
      const hits = PRODUCTS.filter(p => (p.name + p.short).toLowerCase().includes(q.toLowerCase()));
      $("listTitle").textContent = "검색 결과 " + hits.length + "건";
      renderFeature(featured, true);
      renderGrid(hits);
    } else {
      $("listTitle").textContent = "다른 리뷰 제품";
      renderFeature(featured, false);
      renderGrid(PRODUCTS.filter(p => p.slug !== featured.slug));
    }
  }

  $("q").addEventListener("input", render);
  window.addEventListener("hashchange", render);
  render();
</script>
